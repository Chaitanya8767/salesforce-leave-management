<template>
  <lightning-card title="Pending Approvals" icon-name="standard:approval">
    <template if:true={isManager.data}>
      <div class="slds-p-around_medium">
        <template if:true={hasRows}>
          <lightning-datatable key-field="Id" data={rows} columns={columns}
                               max-row-selection="1" onrowselection={handleSelect}></lightning-datatable>
          <lightning-textarea label="Manager Comments" value={comments}
                              onchange={handleComments} class="slds-m-top_small"></lightning-textarea>
          <lightning-button variant="success" label="Approve" onclick={approve}></lightning-button>
          <lightning-button variant="destructive" label="Reject" class="slds-m-left_small"
                            onclick={reject}></lightning-button>
        </template>
        <template if:false={hasRows}>
          <p>No pending requests.</p>
        </template>
      </div>
    </template>
    <template if:false={isManager.data}>
      <p class="slds-p-around_medium">Only managers can view this section.</p>
    </template>
  </lightning-card>
</template>
