<template>
  <lightning-card title="Leave Requests" icon-name="standard:list">
    <lightning-button slot="actions" label="Refresh" onclick={load}></lightning-button>
    <div class="slds-p-around_medium">
      <div class="slds-grid slds-gutters">
        <div class="slds-col">
          <lightning-combobox label="Status" value={statusFilter} options={statusOptions}
                              onchange={handleStatus}></lightning-combobox>
        </div>
        <div class="slds-col">
          <lightning-input type="search" label="Search" onchange={handleSearch}></lightning-input>
        </div>
      </div>
      <template if:true={errorMessage}>
        <p class="slds-text-color_error slds-m-bottom_small">{errorMessage}</p>
      </template>
      <template if:true={loading}>
        <lightning-spinner size="small"></lightning-spinner>
      </template>
      <template if:true={hasRows}>
        <lightning-datatable key-field="Id" data={filtered} columns={columns}
                             hide-checkbox-column></lightning-datatable>
      </template>
      <template if:false={hasRows}>
        <p class="slds-m-top_medium">No leave requests found.</p>
      </template>
    </div>
  </lightning-card>
</template>
